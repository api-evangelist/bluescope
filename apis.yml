aid: bluescope

name: BlueScope

description: 'BlueScope (BlueScope Steel Limited, ASX-listed, headquartered in Australia) is a steel supplier and manufacturer for the building and construction industries, producing flat and painted steel
  products sold under brands including COLORBOND, ZINCALUME, LYSAGHT, TRUECORE and Butler, with operations across Australia, New Zealand, North America, ASEAN and China. BlueScope runs a Developer Centre
  (developer.apiaut.bluescope.com, an Azure API Management portal) for B2B EDI trading with its business units: REST APIs accepting XML or JSON for purchase orders, order responses, shipment notifications,
  invoices, test certificates and GS1 transport messages, with the API list visible only after sign-up and approved product subscription. dev.bluescope.com is a staging copy of the corporate site, not the
  developer portal.'

