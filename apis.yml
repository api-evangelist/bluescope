apis:
- aid: bluescope:bluescope-edi-apis
  name: BlueScope EDI Trading APIs
  description: 'REST APIs from BlueScope''s Developer Centre that enable EDI trading with BlueScope business units (Orrcon, BlueScope Steel Distribution/BSFP, BlueScope Buildings/BBC, CIPA): sending purchase
    orders in GS1 or ASI format, and receiving order responses, shipment notifications (despatch advice), invoices, test certificates and GS1 transport instruction/status messages, in XML or JSON. Calls
    need an Azure AD OAuth 2.0 bearer token (client credentials issued by BlueScope Integration Support) plus an Ocp-Apim-Subscription-Key from an approved product subscription; the API definitions are
    shown only to signed-in subscribers, and the public portal publishes JSON Schemas and examples in its welcome packs.'
  humanURL: https://developer.apiaut.bluescope.com/
