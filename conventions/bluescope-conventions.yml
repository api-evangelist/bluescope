outbound_delivery:
  statement: Inbound-to-partner documents (e.g. GS1 Transport Instruction) are delivered by BlueScope to a partner HTTPS endpoint or SFTP folder configured at onboarding.
  source: "https://developer.apiaut.bluescope.com/GettingStartedPage_LogisticsVendorTransportEDI_Receiving GS1TS"
