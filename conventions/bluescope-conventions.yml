auth:
  summary: Azure AD OAuth 2.0 bearer token (Authorization header) plus Ocp-Apim-Subscription-Key header (or subscription-key query parameter).
  see: authentication/bluescope-authentication.yml
asynchrony:
  statement: "For an asynchronous message you should receive a 202 created response code, on the other hand for a synchronous api call you will get a 200 ok response code."
